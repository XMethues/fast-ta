[workspace]
resolver = "3"
members = [
    "crates/fast-ta",
    "crates/ta-py",
    "crates/ta-wasm",
    "crates/ta-benchmarks",
]
default-members = [
    "crates/fast-ta",
    "crates/ta-wasm",
    "crates/ta-benchmarks",
]

[workspace.dependencies]
wide = { version = "1.5.0", features = ["std"] }
