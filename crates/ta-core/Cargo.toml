[package]
name = "fast-ta"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
authors = ["TA-Lib Rust Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/XMethues/fast-ta"
description = "High-performance technical analysis indicators with batch, prepared, and streaming APIs"
keywords = ["technical-analysis", "trading", "indicators", "ta-lib", "finance"]
categories = ["algorithms", "data-structures", "mathematics", "no-std"]

[lib]
name = "ta_core"

[features]
default = ["f64", "std"]
f32 = []
f64 = []
std = []
core_error = []
simd-qualification = []

[dependencies]
wide = { workspace = true, features = ["std"] }
aligned-vec = "0.6.4"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.11.0"
quickcheck = "1.1.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
