[package]
name = "ta-py"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
authors = ["TA-Lib Rust Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/rs-indicators"
description = "Python bindings for technical analysis indicators"
keywords = ["python", "pyo3", "technical-analysis", "trading", "indicators"]
categories = ["api-bindings", "wasm"]

[lib]
name = "ta_py"
crate-type = ["cdylib"]
test = false

[dependencies]
fast-ta = { path = "../ta-core", version = "0.2.0" }
pyo3 = { version = "0.29.0", features = ["extension-module"] }
numpy = "0.29.0"

[build-dependencies]
pyo3-build-config = "0.29.0"

[package.metadata.maturin]
name = "ta_py"

[package.metadata.docs.rs]
all-features = true
