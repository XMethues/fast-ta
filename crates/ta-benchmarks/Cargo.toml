[package]
name = "ta-benchmarks"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
authors = ["TA-Lib Rust Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/XMethues/fast-ta"
description = "Performance benchmarks for technical analysis indicators"
keywords = ["benchmark", "performance", "technical-analysis", "indicators"]
categories = ["development-tools::profiling", "development-tools::testing"]

[features]
default = ["f64"]
f32 = ["fast-ta/f32", "fast-ta/std"]
f64 = ["fast-ta/f64", "fast-ta/std"]
catalogue-matrix = ["dep:serde_json"]
simd-qualification = ["dep:serde_json", "fast-ta/simd-qualification"]
[[bin]]
name = "catalogue-matrix"
path = "src/bin/catalogue_matrix.rs"
required-features = ["catalogue-matrix"]

[[test]]
name = "catalogue_matrix"
path = "tests/catalogue_matrix.rs"
required-features = ["catalogue-matrix"]

[[test]]
name = "native_typprice_qualification"
path = "tests/native_typprice_qualification.rs"
required-features = ["simd-qualification"]

[[bin]]
name = "catalogue-report"
path = "src/bin/catalogue_report.rs"
required-features = ["catalogue-matrix"]

[[bench]]
name = "basic"
harness = false



[[bench]]
name = "execution_baselines"
harness = false

[[bench]]
name = "cycle_regression"
harness = false


[[bench]]
name = "execution_allocations"
harness = false

[[bench]]
name = "pattern_recognition_baselines"
harness = false

[dependencies]
fast-ta = { path = "../fast-ta", version = "0.2.2", default-features = false }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
criterion = "0.8.2"

[package.metadata.docs.rs]
all-features = true
