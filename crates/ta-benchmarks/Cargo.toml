[package]
name = "ta-benchmarks"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
authors = ["TA-Lib Rust Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/rs-indicators"
description = "Performance benchmarks for technical analysis indicators"
keywords = ["benchmark", "performance", "technical-analysis", "indicators"]
categories = ["development-tools::profiling", "development-tools::testing"]

[features]
default = []
catalogue-matrix = ["dep:serde_json"]

[[bin]]
name = "catalogue-matrix"
path = "src/bin/catalogue_matrix.rs"
required-features = ["catalogue-matrix"]

[[test]]
name = "catalogue_matrix"
path = "tests/catalogue_matrix.rs"
required-features = ["catalogue-matrix"]

[[bin]]
name = "catalogue-report"
path = "src/bin/catalogue_report.rs"
required-features = ["catalogue-matrix"]

[[bench]]
name = "basic"
harness = false



[[bench]]
name = "execution_baselines"
harness = false

[[bench]]
name = "cycle_regression"
harness = false


[[bench]]
name = "execution_allocations"
harness = false

[[bench]]
name = "pattern_recognition_baselines"
harness = false

[dependencies]
ta-core = { path = "../ta-core" }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
criterion = "0.8.2"

[package.metadata.docs.rs]
all-features = true
