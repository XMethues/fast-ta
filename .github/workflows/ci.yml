name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            rust: stable
            rustflags: ""
            mode: test


          - target: aarch64-apple-darwin
            os: macos-latest
            rust: stable
            rustflags: ""
            mode: test

          - target: wasm32-unknown-unknown
            os: ubuntu-latest
            rust: stable
            rustflags: ""
            mode: check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          override: true
          target: ${{ matrix.target }}

      - name: Build and test
        if: matrix.mode == 'test'
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo test -p ta-core --all-targets --verbose --target ${{ matrix.target }}

      - name: Check cross-compiled target
        if: matrix.mode == 'check'
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo check -p ta-core --lib --verbose --target ${{ matrix.target }}

      - name: Test f32 correctness
        if: matrix.target == 'x86_64-unknown-linux-gnu' && matrix.rustflags == ''
        env:
          RUSTFLAGS: ""
        run: cargo test -p ta-core --no-default-features --features f32,std

      - name: Check no-std float modes
        if: matrix.target == 'x86_64-unknown-linux-gnu' && matrix.rustflags == ''
        env:
          RUSTFLAGS: ""
        run: |
          cargo check -p ta-core --lib --no-default-features --features f64,core_error
          cargo check -p ta-core --lib --no-default-features --features f32,core_error

      - name: Run clippy
        if: matrix.mode == 'test'
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo clippy -p ta-core --all-targets --verbose --target ${{ matrix.target }}

      - name: Run rustfmt check
        run: |
          cargo fmt --all -- --check
